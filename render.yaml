services:
  - type: web
    name: freshguard-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: ML_SERVICE_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false

  - type: web
    name: freshguard-ml
    runtime: python
    rootDir: ml
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
  - type: worker
    name: freshguard-simulator
    runtime: python
    rootDir: simulator
    buildCommand: pip install -r requirements.txt
    startCommand: python simulate.py
    envVars:
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FRUIT_TYPE
        value: banana
